# Supabase project config for nube billboard
# Replace the project_id value with your actual Supabase project ref.
# Run: supabase link --project-ref <your-ref>

project_id = "your-project-ref-here"

[api]
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
port = 54323

[inbucket]
port = 54324

[storage]
enabled = true
# Billboard storage buckets will be created via migration

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = []
jwt_expiry = 3600
enable_signup = true

[functions]
# JWT verification disabled so the billboard can be used without auth
# (mirrors the PHP behaviour — open POST endpoint)
verify_jwt = false
